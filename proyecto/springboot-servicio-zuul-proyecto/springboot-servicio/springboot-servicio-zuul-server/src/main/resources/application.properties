###############################################################################
#  CONFIGURACION DEL SERVIDOR ZUUL - Tarea 4
#  Seminario de Ciencias de la Computacion B
###############################################################################

# Identificacion del servicio
spring.application.name=servicio-zuul-server
server.port=8090

# Cliente de Eureka (descubrimiento de servicios)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

###############################################################################
# 1) RUTEO DINAMICO
#    Zuul usa Eureka para descubrir los microservicios. Cada ruta se mapea por
#    "service-id" (el nombre con el que el microservicio se registra en Eureka).
#    Cualquier instancia nueva que se levante de servicio-productos o
#    servicio-items sera enrutada automaticamente sin reiniciar Zuul.
###############################################################################
zuul.routes.productos.service-id=servicio-productos
zuul.routes.productos.path=/api/productos/**

zuul.routes.items.service-id=servicio-items
zuul.routes.items.path=/api/items/**

###############################################################################
# 2) BALANCEO DE PUERTOS CON HYSTRIX (Ribbon + Hystrix)
#    - Ribbon es el cliente HTTP del lado de Zuul; equilibra automaticamente las
#      llamadas entre las distintas instancias que Eureka tiene registradas para
#      el mismo service-id (por ejemplo, dos instancias del servicio-productos
#      en puertos aleatorios).
#    - Hystrix envuelve cada llamada (Hystrix Command) y aplica el patron
#      circuit-breaker/fallback.
###############################################################################
ribbon.eureka.enabled=true
ribbon.ConnectTimeout=3000
ribbon.ReadTimeout=10000

###############################################################################
# 4) LATENCIA - Timeout de Hystrix
#    Si una llamada a un microservicio tarda mas de 1 segundo (1000 ms), Hystrix
#    abre el circuito y dispara el FallbackProvider que esta registrado.
#    Asi, una respuesta lenta no bloquea al cliente: se devuelve una respuesta
#    alternativa de inmediato.
###############################################################################
hystrix.command.default.execution.isolation.thread.timeoutInMilliseconds=1000

# Permitimos que el timeout de Zuul (Hystrix) se aplique a las rutas estaticas
zuul.ribbon-isolation-strategy=THREAD

###############################################################################
# Endpoints de Actuator (opcional, util para depurar)
#   /actuator/routes  -> muestra las rutas activas en Zuul
#   /actuator/hystrix.stream -> stream de eventos Hystrix para Hystrix Dashboard
###############################################################################
management.endpoints.web.exposure.include=*
